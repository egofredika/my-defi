<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDeFi - Next-Gen Web3 Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-center py-2 px-4 text-xs font-semibold tracking-wide">
        <span class="inline-flex items-center gap-1.5">
            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>
            OPN Network Status: Connected
        </span>
    </div>

    <nav class="border-b border-slate-900 bg-slate-950/70 backdrop-blur-md px-4 sm:px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-8">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center font-black text-white text-lg">M</div>
                <span class="text-xl font-black tracking-wider text-white">MyDeFi</span>
            </div>
        </div>
        <button id="connectBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-sm font-bold transition shadow-lg shadow-indigo-600/20 flex items-center gap-2">
            <i class="fa-solid fa-wallet text-xs"></i> Connect Wallet
        </button>
    </nav>

    <main class="max-w-6xl mx-auto px-4 pt-12 pb-24 relative">
        
        <div class="mb-10 p-6 bg-slate-900/40 border border-slate-900 rounded-2xl backdrop-blur-sm">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-cube text-indigo-400"></i> OPN Blockchain Live Data
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <p class="text-xs text-slate-500 uppercase font-semibold">Latest Block Height</p>
                    <p id="latestBlock" class="text-2xl font-mono font-bold text-indigo-400 mt-1">Loading...</p>
                </div>
                <div>
                    <p class="text-xs text-slate-500 uppercase font-semibold">Your Wallet Balance</p>
                    <p id="walletBalance" class="text-2xl font-mono font-bold text-emerald-400 mt-1">0.00 OPN</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 text-left">
            <div class="bg-slate-900/20 border border-slate-900 rounded-2xl p-5">
                <p class="text-xs font-semibold text-slate-500 uppercase">Network Gas Price</p>
                <p class="text-xl font-bold mt-1 text-white">0.001 OPN</p>
            </div>
            <div class="bg-slate-900/20 border border-slate-900 rounded-2xl p-5">
                <p class="text-xs font-semibold text-slate-500 uppercase">Block Time</p>
                <p class="text-xl font-bold mt-1 text-white">0.4s</p>
            </div>
            <div class="bg-slate-900/20 border border-slate-900 rounded-2xl p-5 col-span-2 lg:col-span-1">
                <p class="text-xs font-semibold text-slate-500 uppercase">Epoch Number</p>
                <p class="text-xl font-bold mt-1 text-white">#47,823</p>
            </div>
        </div>
    </main>

    <script>
        // 1. Konfigurasi RPC OPN Blockchain (Menggunakan Endpoint Node Publik OPN)
        const OPN_RPC_URL = "https://rpc.iopn.tech"; // Endpoint Node OPN
        const provider = new ethers.JsonRpcProvider(OPN_RPC_URL);

        // Elemen DOM Halaman Web
        const connectBtn = document.getElementById('connectBtn');
        const latestBlockText = document.getElementById('latestBlock');
        const walletBalanceText = document.getElementById('walletBalance');

        // 2. Fungsi Mengambil Data Blok Terbaru secara Real-Time (Tanpa perlu connect wallet)
        async function getBlockchainData() {
            try {
                const blockNumber = await provider.getBlockNumber();
                latestBlockText.innerText = `#${blockNumber}`;
            } catch (error) {
                console.error("Gagal mengambil data blockchain:", error);
                latestBlockText.innerText = "Koneksi Error";
            }
        }

        // Jalankan pelacakan blok setiap 3 detik sekali (Real-time tracking)
        getBlockchainData();
        setInterval(getBlockchainData, 3000);

        // 3. Fungsi Menghubungkan ke Web3 Wallet User (MetaMask/Trust Wallet di Browser)
        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // Minta izin akses akun ke ekstensi dompet user
                    const browserProvider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAddress = accounts[0];

                    // Ubah UI tombol menjadi alamat dompet ringkas
                    connectBtn.innerHTML = `<i class="fa-solid fa-circle text-emerald-400 text-[10px] animate-pulse"></i> ${userAddress.substring(0,6)}...${userAddress.substring(userAddress.length - 4)}`;
                    connectBtn.classList.replace('bg-indigo-600', 'bg-slate-900');
                    connectBtn.classList.add('border', 'border-slate-800');

                    // Ambil saldo dompet user asli dari OPN chain secara live
                    const balance = await provider.getBalance(userAddress);
                    const formattedBalance = ethers.formatEther(balance);
                    walletBalanceText.innerText = `${parseFloat(formattedBalance).toFixed(4)} OPN`;

                } catch (error) {
                    console.error("Akses dompet ditolak:", error);
                    alert("Gagal menghubungkan dompet.");
                }
            } else {
                alert("Dompet Web3 tidak terdeteksi. Silakan buka halaman ini lewat dApp Browser di dalam aplikasi MetaMask/Trust Wallet HP Anda.");
            }
        }

        // Pasang fungsi pada event klik tombol
        connectBtn.addEventListener('click', connectWallet);
    </script>
</body>
    </html>
